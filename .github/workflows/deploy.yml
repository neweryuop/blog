name: Deploy Blog to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'posts/**'
      - 'css/**'
      - 'js/**'
      - 'index.html'
      - 'build.js'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build posts.json
        run: node build.js

      - name: Prepare dist directory
        run: |
          mkdir -p dist
          cp index.html posts.json favicon.svg dist/
          cp -r posts css js dist/
          # 如果有 CNAME 文件，取消下面这行的注释
          # cp CNAME dist/ 2>/dev/null || true

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4